name: fieldkit
description: "Field Kit — free network & security tools for engineers. Runs entirely on your machine."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/oui.tsv.gz
